name: Caixa PostgreSQL CI
on:
  push:
    branches: [development-v1]
  pull_request:
    branches: [development-v1]
permissions:
  contents: read
jobs:
  postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: caixa
          POSTGRES_PASSWORD: caixa-test-only
          POSTGRES_DB: caixa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caixa -d caixa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CAIXA_TEST_POSTGRES: "true"
      CAIXA_TEST_POSTGRES_ADMIN_URL: postgresql://caixa:caixa-test-only@localhost:5432/caixa_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: PostgreSQL integration tests
        run: PYTHONPATH=. pytest -q
